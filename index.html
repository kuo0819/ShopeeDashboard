<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Shopee 選品 V5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="topline">
      <h1>Shopee 選品 V5</h1>
      <span id="dbCount" class="db-count">資料載入中…</span>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="搜尋全部商品 / 分類">
      <select id="aff">
        <option value="">全部狀態</option>
        <option value="unknown">尚未判定</option>
        <option value="queued">待測試</option>
        <option value="verified">已驗證可分潤</option>
        <option value="blocked">不可分潤</option>
        <option value="retry">待重試</option>
      </select>
      <select id="cat"><option value="">全部分類</option></select>
      <select id="sort">
        <option value="score">選品分數</option>
        <option value="trend">成長</option>
        <option value="sold">累積銷量</option>
        <option value="monthly">月銷量</option>
        <option value="rating">評分</option>
      </select>
      <input id="min" type="number" min="0" max="100" value="55" title="最低選品分數" placeholder="最低分數">
      <input id="minSold" type="number" min="0" value="0" title="最低累積銷量" placeholder="最低銷量">
      <select id="perPage" title="每頁顯示數量">
        <option value="20">每頁 20</option>
        <option value="40">每頁 40</option>
        <option value="80">每頁 80</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="resultbar">
    <span id="resultText">商品載入中…</span>
    <span id="pageText"></span>
  </div>
  <div class="grid" id="grid"><div class="loading">正在載入商品索引…</div></div>
  <div class="pagination-wrap">
    <div class="pagination" id="pagination"></div>
    <div class="page-meta">只渲染目前頁面，完整資料仍可搜尋與分頁瀏覽。</div>
  </div>
</main>

<div class="modal" id="detailModal" aria-hidden="true">
  <div class="modal-panel">
    <div class="modal-head">
      <h2 id="detailTitle">商品詳細資料</h2>
      <button class="close" id="detailClose" aria-label="關閉">×</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>
<script src="app.js" defer></script>
</body>
</html>
